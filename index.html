<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS StandBy Dashboard Pro</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --bg-color: #000000;
            --font: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --global-scale: 1.0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-color); color: #ffffff; font-family: var(--font);
            overflow: hidden; width: 100vw; height: 100vh; display: flex;
            justify-content: center; align-items: center; -webkit-user-select: none; user-select: none;
        }

        #scaling-wrapper {
            width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center;
            transform: scale(var(--global-scale)); transform-origin: center center; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        #protection-container { width: 100vw; height: 100vh; display: flex; transition: transform 0.5s ease; }
        .main-slider { width: 100vw; height: 100vh; }
        .page { width: 100vw; height: 100vh; display: flex; justify-content: flex-start; align-items: flex-start; }

        /* --- DASHBOARD GRID (Jetzt als absolut freies Canvas) --- */
        .dashboard-grid {
            position: relative; /* Erlaubt die absolute Positionierung der Widgets */
            width: 100vw; max-width: none; height: 100vh;
            margin: 0;
            overflow: hidden; /* Stufenlose Fläche */
        }

        .widget {
            position: absolute; /* STUFENLOSE POSITIONIERUNG */
            touch-action: none; /* VERHINDERT SCROLLEN BEIM ZIEHEN AUF TOUCHSCREENS */
            width: var(--widget-w, 320px); height: var(--widget-h, 280px);
            border-radius: 36px; padding: 22px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.15);
            transition: border-color 0.2s, background 0.2s; cursor: grab;
        }
        .widget:active { cursor: grabbing; }

        /* --- RESIZE HANDLE (STUFENLOS VERSTELLEN) --- */
        .resize-handle {
            position: absolute; bottom: 15px; right: 15px; width: 30px; height: 30px;
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(5px); border-radius: 50%;
            cursor: nwse-resize; z-index: 50; display: flex; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.3s; pointer-events: auto !important;
        }
        .resize-handle::after { content: '⤡'; color: white; font-size: 16px; transform: rotate(90deg); }
        
        /* --- CONFIG & DELETE BUTTONS --- */
        .widget-config-btn, .widget-delete-btn {
            position: absolute; top: 15px; background: rgba(30, 30, 30, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15); color: white; font-size: 1.1rem; padding: 8px;
            border-radius: 50%; cursor: pointer; backdrop-filter: blur(8px); opacity: 0;
            transition: opacity 0.3s ease-in-out; z-index: 50; pointer-events: auto !important;
        }
        .widget-config-btn { right: 15px; }
        .widget-delete-btn { left: 15px; background: rgba(255, 59, 48, 0.7); }
        
        .widget:hover .resize-handle, .widget:active .resize-handle,
        .widget:hover .widget-config-btn, .widget:hover .widget-delete-btn { opacity: 1; }

        /* DIGITAL & TEXT STYLES */
        .digital-clock { font-size: clamp(3rem, 5vw + 1rem, 6rem); font-weight: 800; letter-spacing: -2px; line-height: 1; }
        .seconds { font-size: 0.35em; margin-left: 5px; font-variant-numeric: tabular-nums; opacity: 0.8; }
        .date-sub { font-size: clamp(1rem, 1.5vw + 0.5rem, 1.5rem); margin-top: 8px; text-transform: capitalize; }
        .analog-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        canvas.analog-canvas { max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: none; }

        /* CALENDAR */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 10px; font-size: clamp(0.7rem, 2vw, 1rem); width: 100%; max-width: 350px; }
        .calendar-grid div { padding: 3px; text-align: center; }
        .cal-head { font-weight: bold; opacity: 0.7; }
        .cal-today { border-radius: 50%; font-weight: 900 !important; }

        /* WEATHER */
        .weather-fullspace-container { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
        .weather-detail-layout { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; text-align: left; }
        .weather-main-row { display: flex; justify-content: space-between; align-items: center; }
        .weather-temp-big { font-size: clamp(3rem, 5vw, 5rem); font-weight: 800; letter-spacing: -1px; line-height: 1; }
        .weather-grid-details { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; font-size: clamp(0.7rem, 1.5vw, 0.9rem); }
        .weather-detail-item { background: rgba(255,255,255,0.06); padding: 6px 10px; border-radius: 12px; display: flex; flex-direction: column; }
        .weather-detail-label { font-size: 0.7rem; opacity: 0.6; margin-bottom: 2px; text-transform: uppercase; }

        .hourly-scroll-container, .daily-list-container { display: flex; gap: 10px; width: 100%; height: 100%; scrollbar-width: none; -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y; }
        .hourly-scroll-container { overflow-x: auto; align-items: center; padding: 5px 0; }
        .daily-list-container { flex-direction: column; overflow-y: auto; padding-right: 2px; }
        .hourly-scroll-container::-webkit-scrollbar, .daily-list-container::-webkit-scrollbar { display: none; }
        .hourly-item { display: flex; flex-direction: column; align-items: center; justify-content: space-around; background: rgba(255,255,255,0.06); padding: 12px 8px; min-width: 70px; height: 90%; border-radius: 18px; }
        .daily-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 7px 14px; border-radius: 12px; font-size: 0.85rem; flex-shrink: 0; }

        /* PHOTOS */
        .inline-photo-widget { width: 100%; height: 100%; background-size: cover; background-position: center; background-repeat: no-repeat; border-radius: 28px; transition: background-image 0.8s ease-in-out, background-size 0.2s; pointer-events: none; }

        /* CONTROLS */
        .inline-controls { display: flex; gap: 12px; margin-top: 12px; z-index: 15; }
        .inline-btn { background: rgba(255, 255, 255, 0.15); border: none; color: white; padding: 10px 20px; border-radius: 18px; font-size: 0.95rem; font-weight: 600; cursor: pointer; backdrop-filter: blur(5px); transition: background 0.2s, transform 0.1s; pointer-events: auto !important; }
        .inline-btn:active { background: rgba(255, 255, 255, 0.3); transform: scale(0.95); }
        .timer-setup-container { display: flex; align-items: center; gap: 10px; font-size: 1.1rem; z-index: 15; }
        .inline-input { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); color: white; padding: 8px; border-radius: 12px; width: 75px; text-align: center; font-size: 1.3rem; font-weight: bold; pointer-events: auto !important; }

        /* UI BUTTONS GLOBAL */
        .ui-btn {
            position: fixed; z-index: 100; background: rgba(30,30,30,0.8); border: none;
            color: white; padding: 14px; border-radius: 50%; cursor: pointer; backdrop-filter: blur(10px);
            pointer-events: auto !important; transition: opacity 0.5s ease; opacity: 1;
        }
        #btn-add { top: 20px; right: 20px; background: rgba(255, 159, 10, 0.9); }
        #btn-settings { bottom: 20px; right: 20px; }
        #btn-fullscreen { bottom: 20px; right: 75px; }

        /* MODALS */
        .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); backdrop-filter: blur(20px); z-index: 200; display: none; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: #1c1c1e; width: 100%; max-width: 500px; border-radius: 24px; padding: 25px; border: 1px solid #2c2c2e; max-height: 90vh; overflow-y: auto; }
        .modal h2 { margin-bottom: 15px; color: #ff9f0a; font-size: 1.4rem; }
        .setting-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
        .setting-group.row-layout { flex-direction: row; align-items: center; justify-content: space-between; }
        .setting-group label { color: #8e8e93; font-size: 0.85rem; }
        .setting-group input, .setting-group select, .setting-group textarea { background: #2c2c2e; border: none; color: white; padding: 10px; border-radius: 8px; font-size: 0.95rem; font-family: inherit; }
        .setting-group input[type="color"] { padding: 4px; height: 38px; cursor: pointer; width: 100%; }
        .setting-group input[type="range"] { padding: 0; cursor: pointer; }
        .modal-close-btn { background: #ff9f0a; color: black; border: none; width: 100%; padding: 12px; border-radius: 12px; font-weight: bold; margin-top: 15px; cursor: pointer; }
        
        .gradient-pad { width: 100%; height: 130px; background: #2c2c2e; border-radius: 12px; position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.15); cursor: crosshair; }
        .gradient-point { width: 16px; height: 16px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 6px rgba(0,0,0,0.8); position: absolute; transform: translate(-50%, -50%); cursor: move; }
        .gradient-point.active { border-color: #ff9f0a; scale: 1.2; }
        .radial-line-pad { width: 100%; height: 50px; background: #2c2c2e; border-radius: 12px; position: relative; border: 1px solid rgba(255,255,255,0.15); cursor: crosshair; display: flex; align-items: center; }
        .radial-line-track { width: 100%; height: 6px; background: rgba(255, 255, 255, 0.2); position: absolute; left: 0; top: 22px; }
        .radial-point { width: 16px; height: 24px; border-radius: 4px; border: 2px solid white; box-shadow: 0 0 6px rgba(0,0,0,0.8); position: absolute; transform: translate(-50%, -50%); top: 25px; cursor: move; }
        .radial-point.active { border-color: #ff9f0a; scale: 1.1; }
    </style>
</head>
<body id="app-body">

    <button class="ui-btn" id="btn-add" onclick="document.getElementById('addWidgetModal').style.display='flex'">➕</button>
    <button class="ui-btn" id="btn-settings">⚙️</button>
    <button class="ui-btn" id="btn-fullscreen">⛶</button>

    <div id="scaling-wrapper">
        <div id="protection-container">
            <div class="main-slider" id="mainSlider">
                <div class="page">
                    <div class="dashboard-grid" id="dashboard-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ADD WIDGET MODAL -->

            <div class="setting-group">
                <label data-key="select_type">Widget-Typ auswählen</label>

                    <option value="calendar" data-key="opt_calendar">Kalender</option>
                    <option value="weather" data-key="opt_weather">Wetter (Aktuell)</option>
                    <option value="hourly" data-key="opt_hourly">Wetter (12 Stunden)</option>
                    <option value="daily" data-key="opt_daily">Wetter (10 Tage)</option>
                    <option value="photo" data-key="opt_photo">Foto-Diashow</option>

    <!-- GLOBAL SYSTEM SETTINGS MODAL -->

            <div class="setting-group"><label data-key="sys_lang">System-Sprache</label><select id="cfg-global-lang"><option value="de-DE">Deutsch (de-DE)</option><option value="en-US">English (en-US)</option></select></div>
            <div class="setting-group"><label data-key="bg_type">Hintergrundtyp</label><select id="cfg-global-bg-type" onchange="toggleBgPicker('global')"><option value="solid" data-key="opt_solid">Einfache Farbe</option><option value="linear" data-key="opt_linear">Linearer Farbverlauf</option><option value="mesh" data-key="opt_mesh">2D Mesh Farbverlauf</option></select></div>
            
            <div id="global-solid-container" class="setting-group"><label data-key="bg_color_label">Hintergrundfarbe</label><input type="color" id="cfg-global-bg-solid" value="#000000"></div>
            
            <div id="global-linear-container" class="setting-group" style="display:none;">
                <label>Linearer Verlauf Farben</label>
                <div style="display:flex; gap:10px;">
                    <input type="color" id="cfg-global-grad-start" value="#ff9f0a">
                    <input type="color" id="cfg-global-grad-end" value="#0a84ff">
                </div>
                <label>Winkel (Grad)</label>
                <input type="range" id="cfg-global-grad-angle" min="0" max="360" value="135">
            </div>

            <div id="global-mesh-container" class="setting-group" style="display:none;"><label data-key="mesh_editor">Mesh Editor</label><div class="gradient-pad" id="global-gradient-pad"></div><div style="display:flex; gap:10px; align-items:center; margin-top:5px;"><input type="color" id="global-point-color" value="#ff9f0a"><button type="button" class="inline-btn" id="global-btn-del-point" style="padding:6px 12px; font-size:0.85rem;" data-key="delete_pt">Löschen</button><div style="display:flex; flex-direction:column; font-size:0.75rem;"><label data-key="basis">Basis</label><input type="color" id="global-mesh-base" value="#000000" style="height:28px; padding:0;"></div></div></div>
            <button class="modal-close-btn" id="btn-close-settings" data-key="close_save">Schließen & Sichern</button>
        </div>
    </div>

    <!-- WIDGET SPECIFIC SETTINGS MODAL -->
    <div class="modal" id="widgetSettingsModal">
        <div class="modal-content">
            <h2 id="widget-settings-title" data-key="widget_custom_title">Widget Anpassung</h2>
            <input type="hidden" id="current-widget-id">
            <div class="setting-group row-layout"><label style="font-weight: bold; color: white;" data-key="text_bold">Text fett anzeigen (Bold)</label><input type="checkbox" id="widget-is-bold" style="width:22px; height:22px;"></div>
            <div class="setting-group"><label data-key="opacity">Hintergrund-Transparenz (0 = Rand verschwindet)</label><input type="range" id="widget-opacity" min="0" max="1" step="0.05" value="0.85"></div>
            <div class="setting-group"><label data-key="widget_bg_type">Widget Hintergrundtyp</label><select id="widget-bg-type" onchange="toggleBgPicker('widget')"><option value="solid" data-key="opt_solid">Einfache Farbe</option><option value="linear" data-key="opt_linear">Linearer Farbverlauf</option><option value="mesh" data-key="opt_mesh">2D Farbverlauf (Mesh)</option></select></div>
            
            <div class="setting-group" id="widget-solid-container"><label data-key="bg_color_label">Hintergrundfarbe</label><input type="color" id="widget-color-bg" value="#111111"></div>
            
            <div id="widget-linear-container" class="setting-group" style="display:none;">
                <label>Linearer Verlauf Farben</label>
                <div style="display:flex; gap:10px;">
                    <input type="color" id="widget-grad-start" value="#ff9f0a">
                    <input type="color" id="widget-grad-end" value="#0a84ff">
                </div>
                <label>Winkel (Grad)</label>
                <input type="range" id="widget-grad-angle" min="0" max="360" value="135">
            </div>

            <div class="setting-group"><label data-key="text_color">Textfarbe Hauptinhalt</label><input type="color" id="widget-color-text" value="#ffffff"></div>
            <div class="setting-group"><label data-key="accent_color">System-Akzentfarbe</label><input type="color" id="widget-color-accent" value="#ff9f0a"></div>
            
            <div class="setting-group" id="group-city" style="display:none;"><label data-key="city_label">Stadt für Wetterdaten</label><input type="text" id="widget-city-input" value="München"></div>
            
            <div class="setting-group" id="group-analog-clockface" style="display:none;">
                <label data-key="face_type">Ziffernblatt-Typ</label>
                <select id="widget-analog-face-type">
                    <option value="none" data-key="face_none">Nur Striche (Leer)</option>
                    <option value="main" data-key="face_main">Hauptzahlen (12, 3, 6, 9)</option>
                    <option value="all" data-key="face_all">Alle Zahlen (1-12)</option>
                </select>
                <label style="margin-top:10px;" data-key="face_bg_type">Zifferblatt-Hintergrundtyp</label>
                <select id="widget-analog-bg-type" onchange="toggleBgPicker('analog')">
                    <option value="solid" data-key="opt_solid">Einfache Farbe</option>
                    <option value="linear" data-key="opt_linear">Linearer Farbverlauf</option>
                    <option value="mesh" data-key="opt_mesh">2D Farbverlauf (Mesh)</option>
                    <option value="radial1d" data-key="radial_grad">Radialer Verlauf (Linien-Editor)</option>
                    <option value="image" data-key="image_label">Bild</option>
                </select>
                <div class="setting-group" id="analog-solid-container" style="margin-top:10px;"><label data-key="bg_color_label">Zifferblatt-Farbe</label><input type="color" id="widget-analog-solid-color" value="#1c1c1e"></div>
                
                <div id="analog-linear-container" class="setting-group" style="display:none; margin-top:10px;">
                    <label>Zifferblatt Linearer Verlauf</label>
                    <div style="display:flex; gap:10px;">
                        <input type="color" id="widget-analog-grad-start" value="#1c1c1e">
                        <input type="color" id="widget-analog-grad-end" value="#3a3a3c">
                    </div>
                    <label>Winkel (Grad)</label>
                    <input type="range" id="widget-analog-grad-angle" min="0" max="360" value="135">
                </div>

                <div id="analog-radial1d-container" class="setting-group" style="display:none; margin-top:10px;"><label data-key="radial_grad">Radialer Linien-Editor</label><div class="radial-line-pad" id="analog-radial-pad"><div class="radial-line-track"></div></div><div style="display:flex; gap:10px; align-items:center; margin-top:5px;"><input type="color" id="analog-radial-point-color" value="#000000"><button type="button" class="inline-btn" id="analog-btn-del-radial-point" style="padding:6px 12px; font-size:0.85rem;" data-key="delete_pt">Löschen</button></div></div>
                <div id="analog-image-container" class="setting-group" style="display:none; margin-top:10px;"><label data-key="upload_face">Zifferblatt Bild hochladen</label><input type="file" id="widget-analog-image-file" accept="image/*"></div>
            </div>
            
            <div class="setting-group" id="group-photo-opts" style="display:none;"><label data-key="photo_fit">Foto Ausrichtungsformat</label><select id="widget-photo-fit"><option value="cover" data-key="fit_cover">Ausfüllen (Cover)</option><option value="contain" data-key="fit_contain">Einpassen (Contain)</option></select><label style="margin-top:8px;" data-key="upload_photos">Neue Fotos hochladen</label><input type="file" id="widget-photo-files" multiple accept="image/*"></div>
            <div class="setting-group" id="group-timezone" style="display:none;"><label data-key="timezone_label">Zeitzone (z.B. America/New_York)</label><input type="text" id="widget-timezone-input" value="Europe/Berlin"></div>
            <button class="modal-close-btn" id="btn-save-widget-settings" data-key="widget_apply">Widget anwenden</button>
        </div>
    </div>

    <script>
        // --- TRANSLATION DATA ---
        const uiTranslations = {
            'de-DE': {

        // --- DASHBOARD CORE ---
        function loadDashboardState() {
            let saved = localStorage.getItem('standby_dashboard_state');
            let state = saved ? JSON.parse(saved) : defaultDashboardState;
            grid.innerHTML = '';
            
            state.forEach(item => {
                if(!widgetConfigs[item.id]) {
                    widgetConfigs[item.id] = (item.type === 'analog') ? baseAnalogConfig() : baseConfig();
                    if(['weather', 'hourly', 'daily'].includes(item.type)) widgetConfigs[item.id].city = 'München';
                    if(item.type === 'world') widgetConfigs[item.id].tz = 'Europe/Berlin';
                }
                grid.insertAdjacentHTML('beforeend', getWidgetHTML(item.id, item.type));
                let wEl = grid.lastElementChild;
                wEl.style.setProperty('--widget-w', item.w); wEl.style.setProperty('--widget-h', item.h);
                
                // Position setzen
                wEl.style.left = item.left || '50px';
                wEl.style.top = item.top || '50px';
                
                if(['weather', 'hourly', 'daily'].includes(item.type)) fetchWeatherMasterData(item.id);
                if(item.type === 'photo') setupDiashowInstance(item.id);
                if(item.type === 'hourly' || item.type === 'daily') enableDragScrollLocal(wEl);
            });
            localStorage.setItem('standby_widgets_v8', JSON.stringify(widgetConfigs));
        }

                w: w.style.getPropertyValue('--widget-w') || '320px', 
                h: w.style.getPropertyValue('--widget-h') || '280px',
                left: w.style.left || '50px',
                top: w.style.top || '50px'
            }));
            localStorage.setItem('standby_dashboard_state', JSON.stringify(state));
        }

        // --- STUFENLOSES BEWEGEN (DRAG & DROP) ---
        let activeDragWidget = null;
        let dragOffsetX = 0, dragOffsetY = 0;

        function initDragDelegation() {
            grid.addEventListener('pointerdown', (e) => {
                // Ignoriere Klicks auf Resize-Griff, Buttons, Inputs und scrollbare Wetter-Elemente
                if (e.target.closest('.resize-handle') || e.target.closest('button') || e.target.closest('input') || e.target.closest('select') || e.target.classList.contains('drag-scroll') || e.target.classList.contains('drag-scroll-y')) {
                    return;
                }
                const widget = e.target.closest('.widget');
                if (!widget) return;

                activeDragWidget = widget;
                widget.setPointerCapture(e.pointerId);
                
                const rect = widget.getBoundingClientRect();
                const scale = globalConfig.scale || 1.0;
                
                // Berechne den Klick-Offset im Widget unter Berücksichtigung des System-Zooms
                dragOffsetX = (e.clientX - rect.left) / scale;
                dragOffsetY = (e.clientY - rect.top) / scale;
                
                widget.style.zIndex = 1000;
            });

            grid.addEventListener('pointermove', (e) => {
                if (!activeDragWidget) return;
                
                const gridRect = grid.getBoundingClientRect();
                const scale = globalConfig.scale || 1.0;
                
                // Neue stufenlose Position relativ zum Grid berechnen
                let newLeft = (e.clientX - gridRect.left) / scale - dragOffsetX;
                let newTop = (e.clientY - gridRect.top) / scale - dragOffsetY;
                
                activeDragWidget.style.left = newLeft + 'px';
                activeDragWidget.style.top = newTop + 'px';
            });

            const stopDrag = (e) => {
                if (!activeDragWidget) return;
                activeDragWidget.style.zIndex = 1;
                activeDragWidget.releasePointerCapture(e.pointerId);
                activeDragWidget = null;
                saveDashboardState(); // Position speichern beim Loslassen
            };

            grid.addEventListener('pointerup', stopDrag);
            grid.addEventListener('pointercancel', stopDrag);
        }

        // --- STUFENLOSES SKALIEREN (RESIZE) ---
        function initResizeDelegation() {
            grid.addEventListener('mousedown', startResizeProcess);
            grid.addEventListener('touchstart', startResizeProcess, {passive: false});
        }

        function startResizeProcess(e) {
            if(!e.target.classList.contains('resize-handle')) return;
            e.preventDefault(); e.stopPropagation();
            const widget = e.target.closest('.widget');
            const startX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const startY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            const startW = widget.offsetWidth; const startH = widget.offsetHeight;

            const onMove = (mEvt) => {
                const scale = globalConfig.scale || 1.0;
                const curX = mEvt.type.includes('mouse') ? mEvt.clientX : mEvt.touches[0].clientX;
                const curY = mEvt.type.includes('mouse') ? mEvt.clientY : mEvt.touches[0].clientY;
                
                // Stufenlose und maßstabsgetreue Vergrößerung
                const newW = Math.max(160, startW + (curX - startX) / scale); 
                const newH = Math.max(160, startH + (curY - startY) / scale);
                
                widget.style.setProperty('--widget-w', `${newW}px`);
                widget.style.setProperty('--widget-h', `${newH}px`);
                
                if(widget.querySelector('.analog-canvas')) {
                    const id = widget.querySelector('.analog-canvas').id;
                    drawAnalogClock(id, new Date(), widgetConfigs[widget.getAttribute('data-id')]);
                }
            };
            const onEnd = () => {
                window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onEnd);
                window.removeEventListener('touchmove', onMove); window.removeEventListener('touchend', onEnd);
                saveDashboardState();
            };
            window.addEventListener('mousemove', onMove); window.addEventListener('mouseup', onEnd);
            window.addEventListener('touchmove', onMove, {passive: false}); window.addEventListener('touchend', onEnd);
        }

        // --- ENGINE-TICKER ---
        let lastSec = -1;
        function updateWidgetsEngine() {
            const now = new Date();
            if(now.getSeconds() !== lastSec) {
                const timeHTML = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}<span class="seconds">${String(now.getSeconds()).padStart(2, '0')}</span>`;
                const dateText = now.toLocaleDateString(globalConfig.lang, { weekday: 'long', day: 'numeric', month: 'long' });
                
                document.querySelectorAll('.digital-clock').forEach(el => el.innerHTML = timeHTML);
                document.querySelectorAll('.date-sub').forEach(el => el.innerText = dateText);
                
                document.querySelectorAll('.widget[data-type="world"]').forEach(w => {
                    try {
                        const id = w.getAttribute('data-id'); const tz = widgetConfigs[id]?.tz || 'Europe/Berlin';
                        document.getElementById(`world-name-${id}`).innerText = tz.includes('/') ? tz.split('/')[1].replace('_', ' ') : tz;
                        document.getElementById(`world-time-${id}`).innerText = now.toLocaleTimeString(globalConfig.lang, { timeZone: tz, hour: '2-digit', minute: '2-digit' });
                    } catch(e) {}
                });
                lastSec = now.getSeconds();
            }

            document.querySelectorAll('.widget[data-type="countdown"]').forEach(w => {
                const id = w.getAttribute('data-id'); if(!inlineTimers[id]) return; let t = inlineTimers[id];
                if(t.state === 'running') { let rem = t.endTimestamp - Date.now(); if(rem <= 0) inlineTimerAction(id, 'reset'); else document.getElementById(`count-display-${id}`).innerText = formatMsToMinSec(rem); } else if(t.state === 'paused') document.getElementById(`count-display-${id}`).innerText = formatMsToMinSec(t.remainingMs);
            });
            document.querySelectorAll('.widget[data-type="stopwatch"]').forEach(w => {
                const id = w.getAttribute('data-id'); if(!inlineStopwatches[id]) return; let sw = inlineStopwatches[id];
                document.getElementById(`stopwatch-display-${id}`).innerText = formatMsToStopwatch(sw.running ? sw.elapsedMs + (Date.now() - sw.startTimestamp) : sw.elapsedMs);
            });
            document.querySelectorAll('.analog-canvas').forEach(canvas => { drawAnalogClock(canvas.id, now, widgetConfigs[canvas.closest('.widget').getAttribute('data-id')]); });
        }

        function weatherFetchCycle() { document.querySelectorAll('.widget[data-type="weather"], .widget[data-type="hourly"], .widget[data-type="daily"]').forEach(w => fetchWeatherMasterData(w.getAttribute('data-id'))); }
        
        async function fetchWeatherMasterData(id) {
            if(!widgetConfigs[id]) return; const city = widgetConfigs[id].city || 'München'; const shortLang = globalConfig.lang.split('-')[0];
            try {
                const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=${shortLang}&format=json`); const geoData = await geoRes.json(); if(!geoData.results?.length) return; const loc = geoData.results[0];
                const weRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current_weather=true&hourly=temperature_2m,relativehumidity_2m,apparent_temperature,weathercode&daily=temperature_2m_max,temperature_2m_min,weathercode&forecast_days=10&timezone=auto`);
                const data = await weRes.json(); if(data.current_weather) { sharedWeatherMap[id] = { locName: loc.name, raw: data }; buildWeatherUIComponents(id); }
            } catch(e) {}
        }

        function getWeatherEmoji(code) { if(code === 0) return "☀️"; if(code >= 1 && code <= 3) return "⛅"; if(code >= 45 && code <= 48) return "🌫️"; if((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return "🌧️"; if((code >= 71 && code <= 77) || code === 85 || code === 86) return "❄️"; return "🌩️"; }
        
        function buildWeatherUIComponents(id) {
            const isEn = globalConfig.lang.startsWith('en');
            const mData = sharedWeatherMap[id]; if(!mData) return; const raw = mData.raw; const current = raw.current_weather;
            const det = document.getElementById(`we-detail-${id}`);
            
            if(det) { 
                let currHourIdx = new Date().getHours();

            } else { 
                ctx.fillStyle = conf.analogSolidColor || '#1c1c1e'; ctx.fill(); 
            }
            
            for (let num = 0; num < 12; num++) { let angle = num * Math.PI / 6; ctx.rotate(angle); ctx.beginPath(); ctx.moveTo(0, -radius); ctx.lineTo(0, -radius + (displaySize * 0.05)); ctx.strokeStyle = conf.text || '#ffffff'; ctx.lineWidth = displaySize * 0.01; ctx.stroke(); ctx.rotate(-angle); }
            const faceType = conf.analogFaceType || 'none';
            if (faceType !== 'none') { ctx.save(); ctx.fillStyle = conf.text || '#ffffff'; ctx.font = conf.isBold ? `bold ${displaySize * 0.07}px 'SF Pro Display'` : `${displaySize * 0.07}px 'SF Pro Display'`; ctx.textBaseline = "middle"; ctx.textAlign = "center"; for (let num = 1; num <= 12; num++) { if (faceType === 'main' && num !== 12 && num !== 3 && num !== 6 && num !== 9) continue; let angle = num * Math.PI / 6; let x = Math.sin(angle) * (radius - (displaySize * 0.12)); let y = -Math.cos(angle) * (radius - (displaySize * 0.12)); ctx.fillText(num.toString(), x, y); } ctx.restore(); }
            let hour = now.getHours() % 12, minute = now.getMinutes(), second = now.getSeconds(), ms = now.getMilliseconds(); hour = (hour * Math.PI / 6) + (minute * Math.PI / (6 * 60)); minute = (minute * Math.PI / 30); let smoothSecond = (second * Math.PI / 30) + (ms * Math.PI / 30000);
            ctx.save(); ctx.rotate(hour); ctx.beginPath(); ctx.lineWidth = displaySize * 0.025; ctx.lineCap = "round"; ctx.strokeStyle = conf.text || '#fff'; ctx.moveTo(0,0); ctx.lineTo(0, -radius * 0.5); ctx.stroke(); ctx.restore();

            document.getElementById('cfg-global-lang').value = globalConfig.lang; 
            document.getElementById('cfg-global-bg-type').value = globalConfig.bgType || 'solid'; 
            document.getElementById('cfg-global-bg-solid').value = globalConfig.bgSolid || '#000000'; 
            document.getElementById('cfg-global-grad-start').value = globalConfig.bgGradStart || '#ff9f0a';
            document.getElementById('cfg-global-grad-end').value = globalConfig.bgGradEnd || '#0a84ff';
            document.getElementById('cfg-global-grad-angle').value = globalConfig.bgGradAngle || 135;
            document.getElementById('global-mesh-base').value = globalConfig.bgBase || '#000000'; 
            meshEditors.global.points = JSON.parse(JSON.stringify(globalConfig.bgMeshPoints || [])); 
            meshEditors.global.activeIndex = -1; 
            toggleBgPicker('global'); 
            settingsModal.style.display = 'flex'; 
        });
        
        document.getElementById('btn-close-settings').addEventListener('click', () => { 
            globalConfig.scale = parseFloat(document.getElementById('cfg-global-scale').value); 
            globalConfig.lang = document.getElementById('cfg-global-lang').value; 
            globalConfig.bgType = document.getElementById('cfg-global-bg-type').value; 
            globalConfig.bgSolid = document.getElementById('cfg-global-bg-solid').value; 
            globalConfig.bgGradStart = document.getElementById('cfg-global-grad-start').value;
            globalConfig.bgGradEnd = document.getElementById('cfg-global-grad-end').value;
            globalConfig.bgGradAngle = parseInt(document.getElementById('cfg-global-grad-angle').value);
            globalConfig.bgBase = document.getElementById('global-mesh-base').value; 
            globalConfig.bgMeshPoints = meshEditors.global.points; 
            localStorage.setItem('standby_global_v8', JSON.stringify(globalConfig)); 
            
            translateStaticUI();
            applyGlobalScale(); 
            lastSec = -1; 
            
            loadDashboardState(); 
            applyAllWidgetStyles(); 
            settingsModal.style.display = 'none'; 
        });

        // --- WIDGET MODAL EVENTS ---
        function openWidgetSettings(id) {
            const conf = widgetConfigs[id]; const type = document.querySelector(`.widget[data-id="${id}"]`).getAttribute('data-type'); document.getElementById('current-widget-id').value = id; 
            const lang = globalConfig.lang || 'de-DE';
            const dictionary = uiTranslations[lang] || uiTranslations['de-DE'];
            document.getElementById('widget-settings-title').innerText = `${dictionary.widget_custom_title}: ${type.toUpperCase()}`; 
            document.getElementById('widget-is-bold').checked = conf.isBold || false; document.getElementById('widget-opacity').value = conf.opacity ?? 0.85; 
            document.getElementById('widget-bg-type').value = conf.bgType || 'solid'; 
            document.getElementById('widget-color-bg').value = conf.bgSolid || '#111111'; 
            document.getElementById('widget-grad-start').value = conf.bgGradStart || '#ff9f0a';
            document.getElementById('widget-grad-end').value = conf.bgGradEnd || '#0a84ff';
            document.getElementById('widget-grad-angle').value = conf.bgGradAngle || 135;
            document.getElementById('widget-mesh-base').value = conf.bgBase || '#111111'; 
            meshEditors.widget.points = JSON.parse(JSON.stringify(conf.bgMeshPoints || [])); 
            meshEditors.widget.activeIndex = -1; 
            document.getElementById('widget-color-text').value = conf.text || '#ffffff'; 
            document.getElementById('widget-color-accent').value = conf.accent || '#ff9f0a';
            
            const isWeather = ['weather', 'hourly', 'daily'].includes(type); document.getElementById('group-city').style.display = isWeather ? 'flex' : 'none'; if(isWeather) document.getElementById('widget-city-input').value = conf.city || 'München';
            const isAnalog = type === 'analog'; document.getElementById('group-analog-clockface').style.display = isAnalog ? 'flex' : 'none'; 
            if(isAnalog) { 
                document.getElementById('widget-analog-face-type').value = conf.analogFaceType || 'none'; 
                document.getElementById('widget-analog-bg-type').value = conf.analogBgType || 'solid'; 
                document.getElementById('widget-analog-solid-color').value = conf.analogSolidColor || '#1c1c1e'; 
                document.getElementById('widget-analog-grad-start').value = conf.analogGradientStart || '#1c1c1e';
                document.getElementById('widget-analog-grad-end').value = conf.analogGradientEnd || '#3a3a3c';
                document.getElementById('widget-analog-grad-angle').value = conf.analogGradientAngle || 135;
                document.getElementById('analog-mesh-base').value = conf.analogMeshBase || '#1c1c1e'; 
                meshEditors.analog.points = JSON.parse(JSON.stringify(conf.analogMeshPoints || [])); 
                meshEditors.analog.activeIndex = -1; 
                radialLineEditor.points = JSON.parse(JSON.stringify(conf.analogRadialPoints || [])); 
                radialLineEditor.activeIndex = -1; 
                document.getElementById('widget-analog-image-file').value = ""; 
                toggleBgPicker('analog'); 
            }
            const isPhoto = type === 'photo'; document.getElementById('group-photo-opts').style.display = isPhoto ? 'flex' : 'none'; if(isPhoto) document.getElementById('widget-photo-fit').value = conf.fit || 'cover';
            document.getElementById('group-timezone').style.display = type === 'world' ? 'flex' : 'none'; if(conf.tz) document.getElementById('widget-timezone-input').value = conf.tz;
            toggleBgPicker('widget'); widgetModal.style.display = 'flex';
        }

        function compressImage(file) { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = (e) => { const img = new Image(); img.onload = () => { const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d'); const MAX_WIDTH = 1024; const MAX_HEIGHT = 1024; let width = img.width; let height = img.height; if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } } else { if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } } canvas.width = width; canvas.height = height; ctx.drawImage(img, 0, 0, width, height); resolve(canvas.toDataURL('image/jpeg', 0.45)); }; img.onerror = () => reject("Bildfehler"); img.src = e.target.result; }; reader.onerror = () => reject("Dateifehler"); reader.readAsDataURL(file); }); }

        document.getElementById('btn-save-widget-settings').addEventListener('click', async () => {
            const id = document.getElementById('current-widget-id').value; const conf = widgetConfigs[id]; const type = document.querySelector(`.widget[data-id="${id}"]`).getAttribute('data-type');
            conf.isBold = document.getElementById('widget-is-bold').checked; conf.opacity = parseFloat(document.getElementById('widget-opacity').value); 
            conf.bgType = document.getElementById('widget-bg-type').value; 
            conf.bgSolid = document.getElementById('widget-color-bg').value; 
            conf.bgGradStart = document.getElementById('widget-grad-start').value;
            conf.bgGradEnd = document.getElementById('widget-grad-end').value;
            conf.bgGradAngle = parseInt(document.getElementById('widget-grad-angle').value);
            conf.bgBase = document.getElementById('widget-mesh-base').value; conf.bgMeshPoints = meshEditors.widget.points; conf.text = document.getElementById('widget-color-text').value; conf.accent = document.getElementById('widget-color-accent').value;
            
            if(['weather', 'hourly', 'daily'].includes(type)) conf.city = document.getElementById('widget-city-input').value.trim() || 'München';
            if(type === 'analog') { 
                conf.analogFaceType = document.getElementById('widget-analog-face-type').value; 
                conf.analogBgType = document.getElementById('widget-analog-bg-type').value; 
                conf.analogSolidColor = document.getElementById('widget-analog-solid-color').value; 
                conf.analogGradientStart = document.getElementById('widget-analog-grad-start').value;
                conf.analogGradientEnd = document.getElementById('widget-analog-grad-end').value;
                conf.analogGradientAngle = parseInt(document.getElementById('widget-analog-grad-angle').value);
                conf.analogMeshBase = document.getElementById('analog-mesh-base').value; conf.analogMeshPoints = meshEditors.analog.points; conf.analogRadialPoints = radialLineEditor.points; const analogFileInp = document.getElementById('widget-analog-image-file'); if (analogFileInp && analogFileInp.files.length > 0) { try { conf.analogImgData = await compressImage(analogFileInp.files[0]); conf.analogImgElement = null; } catch(err) { alert(err); } } 
            }
            if(type === 'world') conf.tz = document.getElementById('widget-timezone-input').value.trim() || 'Europe/Berlin';
            if(type === 'photo') { conf.fit = document.getElementById('widget-photo-fit').value; const fileInput = document.getElementById('widget-photo-files'); if (fileInput.files.length > 0) { let tempPhotos = []; for(let i=0; i<fileInput.files.length; i++) { try { let comp = await compressImage(fileInput.files[i]); tempPhotos.push(comp); } catch(err) {} } if(tempPhotos.length > 0) conf.photos = tempPhotos; } setupDiashowInstance(id); }
            try { localStorage.setItem('standby_widgets_v8', JSON.stringify(widgetConfigs)); } catch (err) { alert("Speicher voll! Bitte lade weniger/kleinere Bilder hoch."); }
            applyAllWidgetStyles(); if(['weather', 'hourly', 'daily'].includes(type)) fetchWeatherMasterData(id); widgetModal.style.display = 'none';
        });
    </script>
